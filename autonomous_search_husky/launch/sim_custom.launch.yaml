launch:
  - arg:
      name: use_sim_time
      default: "true"
  - arg:
      name: setup_path
      default: "/home/labra2/clearpath"
  - arg:
      name: world_file
      default: "$(find-pkg-share autonomous_search_husky)/worlds/world_autonomous.sdf"

  # 1. Abre o Gazebo diretamente com o mundo customizado
  - include:
      file: "$(find-pkg-share ros_gz_sim)/launch/gz_sim.launch.py"
      arg:
        - name: gz_args
          value: "-r $(var world_file)"

  # 2. Ponte do relógio de simulação (/clock)
  - node:
      pkg: ros_gz_bridge
      exec: parameter_bridge
      name: clock_bridge
      output: screen
      args: "/clock@rosgraph_msgs/msg/Clock[gz.msgs.Clock"

  # 3. Spawna o Husky (a200_1077) no mundo
  - include:
      file: "$(find-pkg-share clearpath_gz)/launch/robot_spawn.launch.py"
      arg:
        - name: setup_path
          value: $(var setup_path)
        - name: use_sim_time
          value: $(var use_sim_time)